<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💧 Water Quality Classifier</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d2b4e 50%, #0a3d62 100%);
      min-height: 100vh;
      color: #e0f4ff;
    }

    /* ── Animated wave background ── */
    .waves {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 0; pointer-events: none;
    }
    .wave { animation: wave-anim 8s ease-in-out infinite; transform-origin: center bottom; }
    .wave:nth-child(2) { animation-duration: 11s; animation-delay: -2s; opacity: 0.5; }
    .wave:nth-child(3) { animation-duration: 14s; animation-delay: -4s; opacity: 0.3; }
    @keyframes wave-anim {
      0%,100% { transform: translateX(0) scaleY(1); }
      50%      { transform: translateX(-3%) scaleY(1.05); }
    }

    /* ── Layout ── */
    .container {
      position: relative; z-index: 1;
      max-width: 820px; margin: 0 auto; padding: 40px 20px 80px;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 40px; }
    .logo { font-size: 64px; display: block; margin-bottom: 12px;
            animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    header h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.5px;
                background: linear-gradient(90deg, #7dd3fc, #38bdf8, #0ea5e9);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94c7e8; margin-top: 8px; font-size: 1rem; }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .section-title {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: #38bdf8; margin-bottom: 20px;
    }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width:580px){ .grid { grid-template-columns: 1fr; } }

    /* ── Slider group ── */
    .field label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; color: #bae6fd; margin-bottom: 6px;
    }
    .field label span.val {
      font-weight: 700; color: #38bdf8; font-size: 0.9rem;
      background: rgba(56,189,248,0.15); padding: 2px 8px; border-radius: 6px;
    }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 6px;
      border-radius: 3px; outline: none; cursor: pointer;
      background: linear-gradient(to right, #38bdf8 var(--pct,50%), rgba(255,255,255,0.15) var(--pct,50%));
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: #38bdf8;
      box-shadow: 0 0 8px rgba(56,189,248,0.6); cursor: pointer;
      transition: transform .15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* ── Button ── */
    .btn-wrap { text-align: center; margin-top: 28px; }
    button {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff; border: none; border-radius: 50px;
      padding: 14px 48px; font-size: 1rem; font-weight: 600;
      cursor: pointer; letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(14,165,233,0.4);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover  { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(14,165,233,0.5); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Result ── */
    #result {
      margin-top: 28px; border-radius: 16px; padding: 28px;
      text-align: center; display: none;
      animation: pop-in .4s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes pop-in {
      0%   { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }
    #result.potable   { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35); }
    #result.not-potable { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); }

    .result-icon { font-size: 56px; display: block; margin-bottom: 12px; }
    .result-verdict { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }
    .result-verdict.safe   { color: #4ade80; }
    .result-verdict.unsafe { color: #f87171; }

    .prob-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .prob-box {
      background: rgba(255,255,255,0.07); border-radius: 12px;
      padding: 12px 24px; min-width: 140px;
    }
    .prob-box .label { font-size: 0.75rem; color: #94c7e8; margin-bottom: 4px; }
    .prob-box .pct   { font-size: 1.5rem; font-weight: 700; }
    .prob-box.safe-box   .pct { color: #4ade80; }
    .prob-box.unsafe-box .pct { color: #f87171; }

    /* ── Bar ── */
    .bar-wrap { margin: 16px auto 0; max-width: 360px; }
    .bar-track { background: rgba(255,255,255,0.1); border-radius: 6px; height: 10px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 6px; transition: width 0.8s ease;
                 background: linear-gradient(90deg, #4ade80, #22c55e); }

    .model-note { font-size: 0.75rem; color: #64a5c8; margin-top: 16px; }

    /* ── Loading ── */
    .spinner {
      display: inline-block; width: 22px; height: 22px;
      border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer { text-align: center; margin-top: 40px; color: #4a7a9b; font-size: 0.8rem; }
    footer a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>

<!-- Animated waves -->
<svg class="waves" viewBox="0 0 1440 180" xmlns="http://www.w3.org/2000/svg">
  <path class="wave" fill="rgba(14,165,233,0.08)"
    d="M0,80 C360,160 1080,0 1440,80 L1440,180 L0,180 Z"/>
  <path class="wave" fill="rgba(14,165,233,0.06)"
    d="M0,100 C400,40 1040,160 1440,100 L1440,180 L0,180 Z"/>
  <path class="wave" fill="rgba(14,165,233,0.04)"
    d="M0,120 C480,60 960,180 1440,120 L1440,180 L0,180 Z"/>
</svg>

<div class="container">
  <header>
    <span class="logo">💧</span>
    <h1>Water Quality Classifier</h1>
    <p>Enter water sample measurements to predict if it's safe to drink</p>
  </header>

  <div class="card">
    <p class="section-title">Water Sample Parameters</p>
    <div class="grid" id="sliders"></div>

    <div class="btn-wrap">
      <button id="predictBtn" onclick="predict()">🔬 Analyze Water Quality</button>
    </div>

    <div id="result"></div>
  </div>

  <footer>
    Powered by Random Forest ML Model (runs in your browser)
    &nbsp;·&nbsp; Dataset: <a href="https://www.kaggle.com/adityakadiwal/water-potability" target="_blank">Kaggle Water Potability</a>
  </footer>
</div>

<script>
  let MODEL = null;

  const PARAMS = [
    { id:"ph",      label:"pH",                   min:0,    max:14,    step:0.01, def:7.08  },
    { id:"hard",    label:"Hardness (mg/L)",       min:47,   max:323,   step:0.1,  def:196   },
    { id:"solids",  label:"Solids (ppm)",           min:320,  max:61227, step:1,    def:22014 },
    { id:"chlor",   label:"Chloramines (ppm)",      min:0.35, max:13.13, step:0.01, def:7.12  },
    { id:"sulfate", label:"Sulfate (mg/L)",         min:129,  max:481,   step:0.1,  def:333   },
    { id:"conduct", label:"Conductivity (μS/cm)",   min:181,  max:753,   step:0.1,  def:426   },
    { id:"oc",      label:"Organic Carbon (ppm)",   min:2.2,  max:28.3,  step:0.01, def:14.28 },
    { id:"thm",     label:"Trihalomethanes (μg/L)", min:0.74, max:124,   step:0.01, def:66.4  },
    { id:"turb",    label:"Turbidity (NTU)",        min:1.45, max:6.99,  step:0.01, def:3.97  },
  ];

  // Build sliders
  const grid = document.getElementById('sliders');
  PARAMS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = `
      <label>${p.label} <span class="val" id="v_${p.id}">${p.def}</span></label>
      <input type="range" id="${p.id}" min="${p.min}" max="${p.max}"
             step="${p.step}" value="${p.def}" oninput="updateSlider('${p.id}',this)"/>
    `;
    grid.appendChild(div);
    // Set initial gradient fill
    requestAnimationFrame(() => updateSlider(p.id, document.getElementById(p.id)));
  });

  function updateSlider(id, el) {
    const p = PARAMS.find(x => x.id === id);
    const pct = ((el.value - p.min) / (p.max - p.min) * 100).toFixed(1);
    el.style.setProperty('--pct', pct + '%');
    document.getElementById('v_' + id).textContent = parseFloat(el.value).toFixed(
      p.step < 1 ? 2 : 0
    );
  }

  function scaleFeatures(values) {
    const { mean, scale } = MODEL.scaler;
    return values.map((v, i) => (v - mean[i]) / scale[i]);
  }

  function predictTree(tree, x) {
    let node = 0;
    while (tree.children_left[node] !== -1) {
      const f = tree.feature[node];
      node = x[f] <= tree.threshold[node]
        ? tree.children_left[node]
        : tree.children_right[node];
    }
    const counts = tree.value[node][0];
    const total = counts[0] + counts[1];
    return total === 0 ? 0 : counts[1] / total;
  }

  function predictLocal(values) {
    const x = scaleFeatures(values);
    let safeSum = 0;
    for (const tree of MODEL.trees) {
      safeSum += predictTree(tree, x);
    }
    const safePct = (safeSum / MODEL.trees.length) * 100;
    return {
      potable: safePct >= 50,
      safePct,
      unsafePct: 100 - safePct,
    };
  }

  async function loadModel() {
    const btn = document.getElementById('predictBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Loading model…';
    try {
      const res = await fetch('model.json');
      if (!res.ok) throw new Error('model.json not found');
      MODEL = await res.json();
      btn.disabled = false;
      btn.innerHTML = '🔬 Analyze Water Quality';
    } catch (e) {
      btn.innerHTML = 'Model failed to load';
    }
  }

  async function predict() {
    const btn = document.getElementById('predictBtn');
    const res = document.getElementById('result');

    if (!MODEL) {
      res.className = 'not-potable';
      res.innerHTML = '<p style="color:#f87171">⚠️ Model is still loading. Please wait a moment.</p>';
      res.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Analyzing…';
    res.style.display = 'none';

    const values = PARAMS.map(p => parseFloat(document.getElementById(p.id).value));

    await new Promise(r => setTimeout(r, 300));

    const { potable, safePct, unsafePct } = predictLocal(values);
    showResult(potable, safePct, unsafePct, MODEL.accuracy, MODEL.n_estimators);

    btn.disabled = false;
    btn.innerHTML = '🔬 Analyze Water Quality';
  }

  function showResult(potable, safePct, unsafePct, accuracy, nTrees) {
    const res = document.getElementById('result');
    res.className = potable ? 'potable' : 'not-potable';
    res.style.display = 'block';
    res.innerHTML = `
      <span class="result-icon">${potable ? '✅' : '❌'}</span>
      <div class="result-verdict ${potable ? 'safe' : 'unsafe'}">
        ${potable ? 'POTABLE — Safe to Drink' : 'NOT POTABLE — Unsafe to Drink'}
      </div>
      <div class="prob-row">
        <div class="prob-box safe-box">
          <div class="label">💧 Safe</div>
          <div class="pct">${safePct.toFixed(1)}%</div>
        </div>
        <div class="prob-box unsafe-box">
          <div class="label">☠️ Unsafe</div>
          <div class="pct">${unsafePct.toFixed(1)}%</div>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar-track">
          <div class="bar-fill" style="width:0%" id="bar"></div>
        </div>
      </div>
      <p class="model-note">Model: Random Forest (${nTrees} trees) · Test Accuracy ~${accuracy}%</p>
    `;
    // Animate bar
    setTimeout(() => {
      document.getElementById('bar').style.width = safePct + '%';
      document.getElementById('bar').style.background =
        potable ? 'linear-gradient(90deg,#4ade80,#22c55e)'
                : 'linear-gradient(90deg,#f87171,#ef4444)';
    }, 50);
  }

  loadModel();
</script>
</body>
</html>
